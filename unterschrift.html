<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unterschrift – Volentas GmbH</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:#f4f7f4;color:#1a1a1a;min-height:100vh;}
.kopf{background:#14532D;color:#fff;padding:18px 20px;}
.kopf h1{font-size:19px;font-weight:500;}
.kopf p{font-size:12px;color:rgba(255,255,255,.6);margin-top:3px;}
.box{max-width:560px;margin:0 auto;padding:16px;}
.karte{background:#fff;border-radius:12px;padding:18px;margin-bottom:14px;border:1px solid #E2ECE2;}
.titel{font-size:13px;color:#718096;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.zweck{font-size:17px;font-weight:500;color:#14532D;margin-bottom:10px;}
.text{font-size:14px;line-height:1.6;white-space:pre-wrap;color:#374151;}
.pad{border:1.5px dashed #A5D6A7;border-radius:10px;background:#f9fdf9;position:relative;touch-action:none;}
.pad canvas{display:block;width:100%;height:200px;}
.hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9CA3AF;font-size:14px;pointer-events:none;}
.zeile{display:flex;gap:8px;margin-top:12px;}
button{font-family:inherit;font-size:15px;border-radius:8px;padding:12px 16px;cursor:pointer;border:none;}
.haupt{background:#1B6B3A;color:#fff;flex:1;}
.haupt:disabled{opacity:.5;cursor:wait;}
.neben{background:#fff;color:#1B6B3A;border:1px solid #A5D6A7;}
label.ok{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.5;margin-top:12px;color:#374151;}
label.ok input{margin-top:4px;width:18px;height:18px;flex-shrink:0;}
.fehler{color:#991B1B;font-size:14px;margin-top:10px;}
.fertig{text-align:center;padding:36px 18px;}
.fertig .kreis{width:56px;height:56px;border-radius:50%;background:#1B6B3A;color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
</style>
</head>
<body>
<div class="kopf"><h1>Volentas GmbH</h1><p>Unterschrift</p></div>
<div class="box" id="app"><div class="karte text">Wird geladen …</div></div>

<script>
// Unterschriften-Seite: holt den Auftrag per Token und speichert die Unterschrift
// ueber zwei geschuetzte Datenbank-Funktionen (kein Zugriff auf andere Daten).
var SB='https://xxqukwlwmdomgftumbal.supabase.co';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh4cXVrd2x3bWRvbWdmdHVtYmFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5NzAzNjksImV4cCI6MjA5MDU0NjM2OX0.Fiz9byHCPbhKmp381ILhbXDPGc5LLt0jCLHp8xBb3TU';
var TOKEN=new URLSearchParams(location.search).get('t')||'';
var app=document.getElementById('app');

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
async function rpc(name, body){
  var r=await fetch(SB+'/rest/v1/rpc/'+name,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY},body:JSON.stringify(body)});
  if(!r.ok) throw new Error('Serverfehler '+r.status);
  return r.json();
}
function fertig(text){
  app.innerHTML='<div class="karte fertig"><div class="kreis">✓</div><div class="zweck">'+text+'</div><div class="text">Vielen Dank. Sie können diese Seite jetzt schliessen.</div></div>';
}

async function start(){
  if(!TOKEN){ app.innerHTML='<div class="karte text">Dieser Link ist unvollständig.</div>'; return; }
  var d;
  try{ d=await rpc('get_unterschrift_auftrag',{p_token:TOKEN}); }
  catch(e){ app.innerHTML='<div class="karte text">Der Link konnte nicht geladen werden. Bitte später nochmals versuchen.</div>'; return; }
  if(!d){ app.innerHTML='<div class="karte text">Dieser Link ist ungültig.</div>'; return; }
  if(d.unterschrieben){ fertig('Bereits unterschrieben'); return; }
  app.innerHTML=
    '<div class="karte"><div class="titel">Dokument</div><div class="zweck">'+esc(d.zweck)+'</div><div class="text">'+esc(d.zusammenfassung)+'</div></div>'+
    '<div class="karte"><div class="titel">Unterschrift von '+esc(d.name)+'</div>'+
      '<div class="pad"><canvas id="cv"></canvas><div class="hint" id="hint">Hier mit dem Finger unterschreiben</div></div>'+
      '<label class="ok"><input type="checkbox" id="ok"> Ich habe das Dokument gelesen und unterschreibe es.</label>'+
      '<div class="zeile"><button class="neben" id="neu">Löschen</button><button class="haupt" id="senden">Unterschreiben</button></div>'+
      '<div class="fehler" id="fehler"></div></div>';
  pad();
}

var cv,cx,hat=false,zieht=false;
function pad(){
  cv=document.getElementById('cv');
  var dpr=window.devicePixelRatio||1, w=cv.clientWidth, h=200;
  cv.width=w*dpr; cv.height=h*dpr;
  cx=cv.getContext('2d'); cx.scale(dpr,dpr);
  cx.strokeStyle='#1a2b4a'; cx.lineWidth=2.4; cx.lineCap='round'; cx.lineJoin='round';
  function pos(e){ var r=cv.getBoundingClientRect(), t=e.touches?e.touches[0]:e; return {x:t.clientX-r.left,y:t.clientY-r.top}; }
  function ab(e){ e.preventDefault(); zieht=true; var p=pos(e); cx.beginPath(); cx.moveTo(p.x,p.y); document.getElementById('hint').style.display='none'; }
  function zug(e){ if(!zieht) return; e.preventDefault(); var p=pos(e); cx.lineTo(p.x,p.y); cx.stroke(); hat=true; }
  function auf(){ zieht=false; }
  cv.addEventListener('mousedown',ab); cv.addEventListener('mousemove',zug); window.addEventListener('mouseup',auf);
  cv.addEventListener('touchstart',ab,{passive:false}); cv.addEventListener('touchmove',zug,{passive:false}); cv.addEventListener('touchend',auf);
  document.getElementById('neu').onclick=function(){ cx.clearRect(0,0,cv.width,cv.height); hat=false; document.getElementById('hint').style.display=''; };
  document.getElementById('senden').onclick=senden;
}

// Schneidet die Unterschrift auf ihren Inhalt zu (transparenter Hintergrund)
function zugeschnitten(){
  var d=cx.getImageData(0,0,cv.width,cv.height).data, w=cv.width, h=cv.height, x0=w, y0=h, x1=0, y1=0;
  for(var y=0;y<h;y++) for(var x=0;x<w;x++) if(d[(y*w+x)*4+3]>0){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  var rand=10; x0=Math.max(0,x0-rand); y0=Math.max(0,y0-rand); x1=Math.min(w-1,x1+rand); y1=Math.min(h-1,y1+rand);
  var c=document.createElement('canvas'); c.width=x1-x0+1; c.height=y1-y0+1;
  c.getContext('2d').drawImage(cv,x0,y0,c.width,c.height,0,0,c.width,c.height);
  return c.toDataURL('image/png');
}

async function senden(){
  var f=document.getElementById('fehler'); f.textContent='';
  if(!hat){ f.textContent='Bitte zuerst im Feld unterschreiben.'; return; }
  if(!document.getElementById('ok').checked){ f.textContent='Bitte bestätigen, dass Sie das Dokument gelesen haben.'; return; }
  var b=document.getElementById('senden'); b.disabled=true; b.textContent='Wird gespeichert …';
  try{
    var ok=await rpc('unterschreiben',{p_token:TOKEN,p_bild:zugeschnitten()});
    if(ok) fertig('Unterschrift gespeichert');
    else { f.textContent='Dieser Link wurde bereits verwendet.'; b.disabled=false; b.textContent='Unterschreiben'; }
  }catch(e){ f.textContent='Speichern hat nicht geklappt. Bitte nochmals versuchen.'; b.disabled=false; b.textContent='Unterschreiben'; }
}
start();
</script>
</body>
</html>
